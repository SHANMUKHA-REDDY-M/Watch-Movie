<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎬 Watch Movies | E-Ticket</title>
  <link rel="icon" href="../assets/favicon.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f4f6fa;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .ticket {
      background: #fff;
      border: 2px solid #0d6efd;
      border-radius: 16px;
      width: 420px;
      padding: 20px 25px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .ticket-header {
      text-align: center;
      border-bottom: 2px dashed #ccc;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .ticket-header img {
      width: 70px;
      margin-bottom: 5px;
    }

    .ticket-header h2 {
      color: #0d6efd;
      font-size: 22px;
      letter-spacing: 0.5px;
    }

    .ticket-body {
      font-size: 15px;
      line-height: 1.6;
    }

    .ticket-body table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .ticket-body th, .ticket-body td {
      padding: 6px 0;
      text-align: left;
    }

    .ticket-body th {
      color: #555;
      width: 40%;
      font-weight: 600;
    }

    .ticket-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      border-top: 2px dashed #ccc;
      padding-top: 10px;
      color: #666;
    }

    .barcode {
      text-align: center;
      margin-top: 10px;
    }

    .barcode img {
      width: 180px;
      opacity: 0.8;
    }

    .download-btn {
      background: #0d6efd;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      display: block;
      margin: 20px auto 0;
      transition: 0.3s;
    }

    .download-btn:hover {
      background: #084298;
    }
  </style>
</head>
<body>

  <div class="ticket" id="ticket">
    <div class="ticket-header">
      <img src="../assets/logo.png" alt="Watch Movies Logo" />
      <h2>Watch Movies</h2>
      <p>E-Ticket Confirmation</p>
    </div>

    <div class="ticket-body">
      <table>
        <tr><th>Booking ID:</th><td>#B001</td></tr>
        <tr><th>Movie:</th><td>Inception</td></tr>
        <tr><th>Theatre:</th><td>INOX Galleria</td></tr>
        <tr><th>Seats:</th><td>3</td></tr>
        <tr><th>Date:</th><td>2025-11-02</td></tr>
        <tr><th>Show Time:</th><td>7:30 PM</td></tr>
        <tr><th>Amount Paid:</th><td>₹750</td></tr>
        <tr><th>Payment ID:</th><td>TXN1001</td></tr>
        <tr><th>Status:</th><td><strong style="color:green;">Confirmed</strong></td></tr>
      </table>

      <div class="barcode">
        <img src="../assets/icons/booking.svg" alt="Barcode" />
      </div>
    </div>

    <div class="ticket-footer">
      🎥 Thank you for booking with <strong>Watch Movies!</strong><br/>
      Please arrive 15 minutes before showtime.<br/>
      <button class="download-btn" onclick="window.print()">Download Ticket</button>
    </div>
  </div>

</body>
</html>
