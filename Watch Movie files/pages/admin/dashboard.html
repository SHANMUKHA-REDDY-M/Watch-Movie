<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Watch Movies | Admin Dashboard</title>
  <link rel="icon" href="../../assets/favicon.png">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="../../assets/logo.png" alt="Watch Movies Logo">
      <h1>Admin Dashboard</h1>
    </div>
    <nav>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="users.html">Users</a>
      <a href="transactions.html">Transactions</a>
      <a href="../login.html">Logout</a>
    </nav>
  </header>

  <main class="container">
    <h2>Welcome, Admin 👋</h2>
    <section class="grid-3">
      <div class="card">
        <h3>Total Movies</h3>
        <p id="movieCount">0</p>
      </div>
      <div class="card">
        <h3>Total Users</h3>
        <p id="userCount">0</p>
      </div>
      <div class="card">
        <h3>Total Transactions</h3>
        <p id="txnCount">0</p>
      </div>
    </section>

    <section style="margin-top:2rem;">
      <h3>Recent Bookings</h3>
      <table class="styled-table" id="recentBookings">
        <thead>
          <tr><th>Booking ID</th><th>User</th><th>Movie</th><th>Amount</th><th>Status</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <footer>
    <p>© 2025 Watch Movies | Admin Panel</p>
  </footer>

  <script src="../../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const users = JSON.parse(localStorage.getItem('wm_users')) || [];
      const bookings = JSON.parse(localStorage.getItem('wm_bookings')) || [];
      const movies = JSON.parse(localStorage.getItem('wm_movies')) || [];

      document.getElementById('userCount').innerText = users.length;
      document.getElementById('movieCount').innerText = movies.length;
      document.getElementById('txnCount').innerText = bookings.length;

      const tbody = document.querySelector('#recentBookings tbody');
      bookings.slice(-5).reverse().forEach(b => {
        const row = `
          <tr>
            <td>${b.id}</td>
            <td>${b.user}</td>
            <td>${b.movie}</td>
            <td>₹${b.amount}</td>
            <td>${b.status || 'Confirmed'}</td>
          </tr>`;
        tbody.insertAdjacentHTML('beforeend', row);
      });
    });
  </script>
</body>
</html>
