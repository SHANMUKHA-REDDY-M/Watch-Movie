<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Movies | User Dashboard</title>
  <link rel="icon" href="../../assets/favicon.png" />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/responsive.css" />
</head>
<body>
  <header>
    <div class="logo">
      <img src="../../assets/logo.png" alt="Watch Movies Logo" />
      <h1>Watch Movies</h1>
    </div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../movies.html">Movies</a>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="../login.html" id="logoutBtn">Logout</a>
    </nav>
  </header>

  <main class="container">
    <section class="dashboard">
      <h2>Welcome, <span id="userName">User</span> 👋</h2>
      <div class="dashboard-grid">
        <div class="card">
          <h3>Total Bookings</h3>
          <p id="totalBookings">0</p>
        </div>
        <div class="card">
          <h3>Total Spent</h3>
          <p>₹<span id="totalSpent">0</span></p>
        </div>
        <div class="card">
          <h3>Upcoming Shows</h3>
          <p id="upcomingShows">0</p>
        </div>
      </div>

      <h3 style="margin-top:2rem;">Recent Bookings</h3>
      <div id="recentBookings" class="booking-list"></div>
    </section>
  </main>

  <footer>
    <p>© 2025 Watch Movies | All Rights Reserved.</p>
  </footer>

  <script src="../../js/utils.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const user = JSON.parse(localStorage.getItem("wm_current_user")) || { name: "Guest" };
      document.getElementById("userName").textContent = user.name;

      const bookings = JSON.parse(localStorage.getItem("wm_bookings")) || [];
      const totalSpent = bookings.reduce((sum, b) => sum + (b.amount || 0), 0);
      const upcoming = bookings.filter(b => new Date(b.date) >= new Date()).length;

      document.getElementById("totalBookings").textContent = bookings.length;
      document.getElementById("totalSpent").textContent = totalSpent.toLocaleString();
      document.getElementById("upcomingShows").textContent = upcoming;

      const recent = bookings.slice(-3);
      const container = document.getElementById("recentBookings");
      if (!recent.length) {
        container.innerHTML = "<p>No bookings yet. Go watch something amazing!</p>";
        return;
      }

      recent.forEach(b => {
        const div = document.createElement("div");
        div.classList.add("booking-card");
        div.innerHTML = `
          <h4>${b.movie}</h4>
          <p>${b.theatre} | ${b.date} ${b.time}</p>
          <p>Seats: ${Array.isArray(b.seats) ? b.seats.join(", ") : b.seats}</p>
          <p>Amount: ₹${b.amount}</p>
        `;
        container.appendChild(div);
      });
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("wm_current_user");
      window.location.href = "../login.html";
    });
  </script>
</body>
</html>
