<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Movies | Movie Details</title>
  <link rel="icon" href="../assets/favicon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header>
    <div class="logo">
      <img src="../assets/logo.png" alt="Logo">
      <h1>Watch Movies</h1>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="movies.html">Movies</a>
    </nav>
  </header>

  <section class="movie-details">
    <div class="details-container">
      <img id="moviePoster" alt="Movie Poster">
      <div class="info">
        <h2 id="movieTitle"></h2>
        <p id="movieGenre"></p>
        <p id="movieRating"></p>
        <p id="movieDescription"></p>
        <p><strong>Theatre:</strong> <span id="movieTheatre"></span></p>
        <p><strong>Price:</strong> <span id="moviePrice"></span></p>
        <button id="bookNow" class="btn-primary">Book Now</button>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2025 Watch Movies | All Rights Reserved.</p>
  </footer>

  <script src="../js/utils.js"></script>
  <script src="../js/movieDetails.js"></script>
</body>
</html>
